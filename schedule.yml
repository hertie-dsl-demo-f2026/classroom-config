# DSL-Demo-f2026 - this cohort's release plan AND its display/grading dates, in one file
# (classroom-config/schedule.yml). Read this as a template: copy it, change the dates, and
# delete what you do not use. Every field is optional; a cohort with no schedule.yml simply
# has nothing to auto-release and gets synthesised dates on its website.
#
# Each block encodes a BEHAVIOUR - that is the whole schema:
#   releases:     entries that DEPLOY materials (course org -> this cohort org)
#   assignments:  each assignment's handout / due / grading lifecycle
#   events:       display-only calendar rows - nothing deploys, the site just shows them
#
# How it fires: a release's `event_datetime` is when the thing HAPPENS (what the site's
# schedule shows); the hourly "Scheduled release" cron fires its deploys at that moment,
# except deploys carrying their own `deploy_datetime` (here: lectures ship 08:00, two hours
# before the 10:00 class). Independently of the plan, the cron freezes the submission
# snapshot and autogrades each assignment ONCE at its `grading_datetime` below. Sources are
# always read from the COURSE org (DSL-Demo-Course-E1234), destinations always written to
# this COHORT org - so entries name repos, never orgs.
#
# Changing a date later? Just commit the edit to this file on main - the GitHub web UI is
# the recommended way (or edit a local clone, commit, push). The hourly cron reads whatever
# is on main at each tick, so the change takes effect within the hour. Only already-fired
# ONE-SHOT actions don't rewind: a release already shipped stays shipped, and a
# snapshot/autograde that already ran needs its marker deleted to redo.
#
# Full schema: docs/DEPLOYMENT-CHECKLIST.md#scheduleyml

timezone: Europe/Berlin        # optional (this is the default). Naive times below are read
                               # in this zone; GitHub's cron itself runs in UTC, so an
                               # event_datetime is honoured to the hour, not the minute.

# ------------------------------------------------------------------------- term boundaries
# These two also render as their own rows on the site's schedule ("Semester begins" /
# "Semester ends"), and set the fallback window for anything the plan does not date.
semester_start: 2026-09-08      # first Tuesday of teaching
semester_end: 2026-12-18

releases:
  # Deploys are MINIMAL where the defaults fit: only course_source_repo + course_source_path are
  # required; cohort_dest_repo defaults to `materials`, cohort_dest_path mirrors the source, and each copy ships at
  # the entry's event_datetime. The lecture lines add ONE option - deploy_datetime - to ship
  # two hours before class. (Paths are relative to their repo.)
  #
  # Lecture vs lab is NOT a field: it comes from the section folder deployed here -
  # `lectures/...` renders a lecture row on the site, `labs/...` its own lab row. The label
  # is a free identifier; keeping it `lecture-NN` / `lab-NN` makes the Actions log readable.

  # A one-off deploy that is not a numbered session: the shared teaching dataset, landing
  # under a different path from the one it is stored at. `datasets/` has no ordinal-prefixed
  # subdirectories, so it is NOT a releasable section - this entry is the only way it ships.
  housing-dataset:
    event_datetime: 2026-09-08T08:00
    deploy:
      - course_source_repo: course-materials-f2026
        course_source_path: datasets/housing-mini.csv
        cohort_dest_repo: materials
        cohort_dest_path: data/housing-mini.csv

  # ---------------------------------------------------------------- teaching sessions
  # One entry per session: lecture + readings Tuesdays 10:00 (files ship 08:00), lab
  # Thursdays 14:00.
  lecture-01:
    event_datetime: 2026-09-08T10:00
    deploy:
      - course_source_repo: course-materials-f2026
        course_source_path: lectures/01_introduction
        cohort_dest_repo: materials
        deploy_datetime: 2026-09-08T08:00
      - course_source_repo: course-materials-f2026
        course_source_path: readings/01_introduction
        cohort_dest_repo: materials
      # Release the package skeleton early so every later partial release still imports.
      - course_source_repo: lecture-code-f2026
        course_source_path: pyproject.toml
        cohort_dest_repo: materials
        cohort_dest_path: lecture-code/pyproject.toml
      - course_source_repo: lecture-code-f2026
        course_source_path: README.md
        cohort_dest_repo: materials
        cohort_dest_path: lecture-code/README.md
      - course_source_repo: lecture-code-f2026
        course_source_path: mlfdemo/__init__.py
        cohort_dest_repo: materials
        cohort_dest_path: lecture-code/mlfdemo/__init__.py
      - course_source_repo: lecture-code-f2026
        course_source_path: mlfdemo/datasets.py
        cohort_dest_repo: materials
        cohort_dest_path: lecture-code/mlfdemo/datasets.py

  lab-01:
    event_datetime: 2026-09-10T14:00
    deploy:
      - course_source_repo: course-materials-f2026
        course_source_path: labs/01_introduction
        cohort_dest_repo: materials

  lecture-02:
