# ------------------------------------------------------------------------- assignments
# Each assignment's WHOLE lifecycle in one block. A bare due_datetime is END of day
# (23:59:59) - "due on the 13th" closes at day's end. Autograding needs no entry in
# `releases:`: at each grading_datetime the hourly cron freezes the submission snapshot and
# runs the autograder once (individual/group comes from the template's own grading.yml,
# unless `type:` below overrides it).
assignments:
  assignment-1:
    course_source_repo: assignment-1-f2026   # required: the course-org repo it hands out from
    handout_datetime: 2026-09-22T14:00   # one private repo per enrolled student, automatic
    due_datetime: 2026-10-13T23:59       # what students see
    grading_datetime: 2026-10-15T23:59   # grading-only, never shown to students: the moment
                                         # the submission snapshot freezes AND the hourly
                                         # cron autogrades this assignment, once.
  assignment-2:
    course_source_repo: assignment-2-f2026   # required: the course-org repo it hands out from
    handout_datetime: 2026-10-06T14:00
    due_datetime: 2026-11-03T23:59
    grading_datetime: 2026-11-05T23:59
  assignment-3-project:
    course_source_repo: assignment-3-project-f2026   # required: the course-org repo it hands out from
    handout_datetime: 2026-10-20T14:00
    type: group                 # per-team handout + grading (also set in the
                                # template's grading.yml)
    due_datetime: 2026-11-27T23:59
    max_team_size: 3            # the welcome "Join team" flow refuses a 4th member
    grading_datetime: 2026-11-30T23:59   # the group project: graded per team (teams.csv)

# ----------------------------------------------------------------------------- events
# DISPLAY-ONLY rows: nothing is released, the site's schedule simply shows them.
# `type: exam` colours the row as an exam; leave `type` out for anything else (a clinic, a
# guest lecture, a review session) and it renders as a special event.
events:
  midterm-exam:
    type: exam
    title: Midterm Exam
    event_datetime: 2026-10-27T10:00   # a real start time, shown as given
    tbc: true                          # provisional - the site marks it "(TBC)"
  final-exam:
    type: exam
    title: Final Exam
    event_datetime: 2026-12-15T14:00

  project-clinic:               # no `type:` -> a special event row
    title: Project clinic
    event_datetime: 2026-11-17T10:00
    tbc: true                   # provisional date - the site shows "(TBC)"

  # `event_datetime: tbc` -> an undated TBC row on the site, sorted to end of term; nothing
  # can fire until a real date replaces it. (`tbc: true` next to a real date, as above,
  # marks it "(TBC)" instead.)
  guest-lecture:
    title: Guest lecture (industry speaker)
    event_datetime: tbc

